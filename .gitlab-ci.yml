variables:
  DOCKER_REGISTRY: "localhost:5000"
  APP_NAME: "myapp"
  Sonar_Url: "https://localhost"
  Sonar_Token: "sonarqube"
  security_scan_tool: "trivy"
  GIT_SHA: "$(git rev-parse --short HEAD)"

stages:
  - checkout
  - install
  - build
  - test
  - static-analysis
  - quality-gate
  - docker
  - security-scan
  - deploy

checkout:
  stage: checkout
  script:
    - echo "Checking out source code"
    - git checkout $CI_COMMIT_REF_NAME

install-dependencies:
  stage: install
  script:
    - echo "Installing dependencies"
    - composer install

build:
  stage: build
  script:
    - echo "Building the application"

unit-tests:
  stage: test
  script:
    - echo "Running unit tests"
    - ./vendor/bin/phpunit

static-code-analysis:
  stage: static-analysis
  script:
    - echo "Performing static code analysis"
    - sonar-scanner -Dsonar.host.url=$Sonar_Url -Dsonar.login=$Sonar_Token

quality-gate:
  stage: quality-gate
  script:
    - echo "Checking Quality Gate"
    - QUALITY_GATE_STATUS=$(curl -s -u $Sonar_Token: "$Sonar_Url/api/qualitygates/project_status?projectKey=$APP_NAME" | jq -r .projectStatus.status)
    - if [[ "$QUALITY_GATE_STATUS" != "OK" && "$QUALITY_GATE_STATUS" != "NONE" ]]; then echo "Quality Gate failed" && exit 1; fi

docker-build-push:
  stage: docker
  script:
    - echo "Building and pushing Docker image"
    - docker build -t $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA .
    - docker push $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA

security-scan:
  stage: security-scan
  script:
    - echo "Running security scan"
    - trivy image $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA

deploy:
  stage: deploy
  script:
    - echo "Deploying application"
    - |
      if [ -f "helm/values.yaml" ]; then
        helm upgrade --install $APP_NAME ./helm --set image.repository=$DOCKER_REGISTRY/$APP_NAME --set image.tag=$GIT_SHA
      elif [ -f "deployment.yaml" ]; then
        case "$(uname -s)" in
          Darwin*) sed -i "" "s|image: .*|image: $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA|" deployment.yaml ;;
          *) sed -i "s|image: .*|image: $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA|" deployment.yaml ;;
        esac
        kubectl apply -f deployment.yaml
      else
        echo "No deployment configuration found" && exit 1
      fi
    - echo "Rollback mechanism"
    - |
      if [ $? -ne 0 ]; then
        echo "Deployment failed, rolling back"
        kubectl rollout undo deployment/$APP_NAME
      fi