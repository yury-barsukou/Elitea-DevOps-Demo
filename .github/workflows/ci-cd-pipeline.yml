name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: localhost:5000
  APP_NAME: myapp
  Sonar_Url: https://localhost
  Sonar_Token: sonarqube
  security_scan_tool: trivy
  GIT_SHA: ${{ github.sha }}

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SCM
        uses: actions/checkout@v3

  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Install PHP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli composer
          composer install

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Application
        run: |
          echo "Building application..."

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run Unit Tests
        run: |
          ./vendor/bin/phpunit --configuration phpunit.xml

  static-code-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Perform Static Code Analysis
        run: |
          sonar-scanner -Dsonar.host.url=$Sonar_Url -Dsonar.login=$Sonar_Token

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Check
        run: |
          status=$(curl -s -u $Sonar_Token: "$Sonar_Url/api/qualitygates/project_status?projectKey=$APP_NAME" | jq -r '.projectStatus.status')
          if [[ "$status" != "OK" && "$status" != "NONE" ]]; then
            echo "Quality Gate failed!"
            exit 1
          fi

  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Build and Push Docker Image
        run: |
          docker build -t $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA .
          docker push $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run Security Scan
        run: |
          trivy image $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        run: |
          if [ -f helm/values.yaml ]; then
            helm upgrade --install $APP_NAME ./helm --set image.repository=$DOCKER_REGISTRY/$APP_NAME --set image.tag=$GIT_SHA
          elif [ -f deployment.yaml ]; then
            case "$(uname -s)" in
              Darwin*) sed -i '' "s|image: .*|image: $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA|" deployment.yaml ;;
              Linux*) sed -i "s|image: .*|image: $DOCKER_REGISTRY/$APP_NAME:$GIT_SHA|" deployment.yaml ;;
            esac
            kubectl apply -f deployment.yaml
          else
            echo "No deployment configuration found!"
            exit 1
          fi

  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Rollback Deployment
        if: failure()
        run: |
          echo "Rolling back to previous deployment..."
          previous_tag=$(kubectl get deployment $APP_NAME -o=jsonpath='{.spec.template.spec.containers[0].image}' | awk -F ':' '{print $2}')
          if [ -z "$previous_tag" ]; then
            echo "No previous deployment found!"
            exit 1
          fi
          case "$(uname -s)" in
            Darwin*) sed -i '' "s|image: .*|image: $DOCKER_REGISTRY/$APP_NAME:$previous_tag|" deployment.yaml ;;
            Linux*) sed -i "s|image: .*|image: $DOCKER_REGISTRY/$APP_NAME:$previous_tag|" deployment.yaml ;;
          esac
          kubectl apply -f deployment.yaml