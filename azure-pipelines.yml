trigger:
- main

variables:
  DOCKER_REGISTRY: "localhost:5000"
  APP_NAME: "myapp"
  Sonar_Url: "https://localhost"
  Sonar_Token: "sonarqube"
  security_scan_tool: "trivy"
  GIT_SHA: "$(Build.SourceVersionShort)"

stages:
- stage: Checkout
  displayName: "Checkout SCM"
  jobs:
  - job: Checkout
    steps:
    - checkout: self

- stage: InstallDependencies
  displayName: "Install Dependencies"
  jobs:
  - job: Install
    steps:
    - script: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
      displayName: "Install Python dependencies"

- stage: Build
  displayName: "Build Application"
  jobs:
  - job: Build
    steps:
    - script: |
        echo "Building application..."
      displayName: "Build Step"

- stage: UnitTests
  displayName: "Run Unit Tests"
  jobs:
  - job: Tests
    steps:
    - script: |
        source venv/bin/activate
        pytest
      displayName: "Run Pytest"

- stage: StaticCodeAnalysis
  displayName: "Static Code Analysis"
  jobs:
  - job: SonarQube
    steps:
    - script: |
        echo "Running static code analysis..."
      displayName: "Run SonarQube Analysis"

- stage: QualityGate
  displayName: "Quality Gate"
  dependsOn: StaticCodeAnalysis
  condition: succeeded()
  jobs:
  - job: QualityGate
    steps:
    - script: |
        echo "Checking Quality Gate..."
      displayName: "Quality Gate Check"

- stage: DockerBuildPush
  displayName: "Docker Build and Push"
  jobs:
  - job: Docker
    steps:
    - script: |
        docker build -t $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA) .
        docker push $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)
      displayName: "Build and Push Docker Image"

- stage: SecurityScan
  displayName: "Security Scan"
  jobs:
  - job: Security
    steps:
    - script: |
        trivy image $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)
      displayName: "Run Security Scan"

- stage: Deploy
  displayName: "Deploy Application"
  jobs:
  - job: Deploy
    steps:
    - script: |
        if [ -f "helm/values.yaml" ]; then
          helm upgrade --install $(APP_NAME) ./helm --set image.repository=$(DOCKER_REGISTRY)/$(APP_NAME) --set image.tag=$(GIT_SHA)
        elif [ -f "deployment.yaml" ]; then
          case "$(uname -s)" in
            Darwin*) sed -i '' "s|image: .*|image: $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)|" deployment.yaml ;;
            *) sed -i "s|image: .*|image: $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)|" deployment.yaml ;;
          esac
          kubectl apply -f deployment.yaml
        else
          echo "Error: No deployment configuration found!" && exit 1
        fi
      displayName: "Deploy Application"

- stage: Rollback
  displayName: "Rollback on Failure"
  condition: failed()
  jobs:
  - job: Rollback
    steps:
    - script: |
        echo "Rolling back to previous stable version..."
      displayName: "Rollback Step"