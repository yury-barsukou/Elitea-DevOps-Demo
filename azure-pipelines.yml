trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOCKER_REGISTRY: 'localhost:5000'
  APP_NAME: 'myapp'
  Sonar_Url: 'https://localhost'
  Sonar_Token: 'sonarqube'
  security_scan_tool: 'trivy'
  GIT_SHA: $(Build.SourceVersion)

stages:
- stage: Checkout
  displayName: 'Checkout SCM'
  jobs:
  - job: Checkout
    steps:
    - checkout: self

- stage: InstallDependencies
  displayName: 'Install Dependencies'
  jobs:
  - job: Install
    steps:
    - script: |
        composer install
      displayName: 'Install PHP Dependencies'

- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: Build
    steps:
    - script: |
        echo "Building application..."
      displayName: 'Build Application'

- stage: UnitTests
  displayName: 'Run Unit Tests'
  jobs:
  - job: Tests
    steps:
    - script: |
        ./vendor/bin/phpunit
      displayName: 'Run PHP Unit Tests'

- stage: StaticCodeAnalysis
  displayName: 'Static Code Analysis'
  jobs:
  - job: Analysis
    steps:
    - script: |
        sonar-scanner -Dsonar.host.url=$(Sonar_Url) -Dsonar.login=$(Sonar_Token)
      displayName: 'Run SonarQube Analysis'

- stage: QualityGate
  displayName: 'Quality Gate Check'
  dependsOn: StaticCodeAnalysis
  condition: succeeded()
  jobs:
  - job: QualityGate
    steps:
    - script: |
        echo "Quality Gate Passed"
      displayName: 'Quality Gate Passed'

- stage: DockerBuildPush
  displayName: 'Docker Build and Push'
  jobs:
  - job: Docker
    steps:
    - script: |
        docker build -t $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA) .
        docker push $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)
      displayName: 'Docker Build and Push'

- stage: SecurityScan
  displayName: 'Security Scan'
  jobs:
  - job: Security
    steps:
    - script: |
        trivy image $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)
      displayName: 'Run Security Scan'

- stage: Deploy
  displayName: 'Deploy Application'
  jobs:
  - job: Deploy
    steps:
    - script: |
        if [ -f "helm/values.yaml" ]; then
          helm upgrade --install $(APP_NAME) ./helm --set image.repository=$(DOCKER_REGISTRY)/$(APP_NAME) --set image.tag=$(GIT_SHA)
        elif [ -f "deployment.yaml" ]; then
          case "$(uname -s)" in
            Darwin*) sed -i '' "s|image:.*|image: $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)|" deployment.yaml ;;
            *) sed -i "s|image:.*|image: $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)|" deployment.yaml ;;
          esac
          kubectl apply -f deployment.yaml
        else
          echo "Error: No deployment configuration found!" && exit 1
      displayName: 'Deploy Application'

- stage: Rollback
  displayName: 'Rollback Mechanism'
  dependsOn: Deploy
  condition: failed()
  jobs:
  - job: Rollback
    steps:
    - script: |
        echo "Deployment failed. Rolling back to previous version..."
      displayName: 'Rollback to Previous Version'