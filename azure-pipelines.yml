trigger:
- main

variables:
  DOCKER_REGISTRY: "localhost:5000"
  APP_NAME: "myapp"
  Sonar_Url: "https://localhost"
  Sonar_Token: "sonarqube"
  security_scan_tool: "trivy"
  GIT_SHA: "$(Build.SourceVersionShort)"

stages:
- stage: Checkout
  displayName: "Checkout Code"
  jobs:
  - job: Checkout
    steps:
    - task: Checkout@1

- stage: InstallDependencies
  displayName: "Install Dependencies"
  jobs:
  - job: Install
    steps:
    - script: |
        composer install
      displayName: "Install PHP Dependencies"

- stage: Build
  displayName: "Build Application"
  jobs:
  - job: Build
    steps:
    - script: |
        echo "Building application..."
      displayName: "Build Application"

- stage: UnitTests
  displayName: "Run Unit Tests"
  jobs:
  - job: Tests
    steps:
    - script: |
        ./vendor/bin/phpunit
      displayName: "Run PHPUnit Tests"

- stage: StaticCodeAnalysis
  displayName: "Static Code Analysis"
  jobs:
  - job: CodeAnalysis
    steps:
    - script: |
        sonar-scanner -Dsonar.host.url=$(Sonar_Url) -Dsonar.login=$(Sonar_Token)
      displayName: "Run SonarQube Analysis"

- stage: QualityGate
  displayName: "Quality Gate"
  dependsOn: StaticCodeAnalysis
  condition: succeeded()
  jobs:
  - job: QualityGate
    steps:
    - script: |
        echo "Quality Gate Passed"
      displayName: "Quality Gate Check"

- stage: DockerBuildPush
  displayName: "Docker Build and Push"
  jobs:
  - job: Docker
    steps:
    - script: |
        docker build -t $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA) .
        docker push $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)
      displayName: "Build and Push Docker Image"

- stage: SecurityScan
  displayName: "Security Scan"
  jobs:
  - job: Security
    steps:
    - script: |
        trivy image $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)
      displayName: "Run Security Scan"

- stage: Deploy
  displayName: "Deploy Application"
  jobs:
  - job: Deploy
    steps:
    - script: |
        case "$(uname -s)" in
          Darwin*) sed -i '' "s|image:.*|image: $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)|" deployment.yaml ;;
          *) sed -i "s|image:.*|image: $(DOCKER_REGISTRY)/$(APP_NAME):$(GIT_SHA)|" deployment.yaml ;;
        esac
        kubectl apply -f deployment.yaml
      displayName: "Deploy Application"

- stage: Rollback
  displayName: "Rollback Deployment"
  condition: failed()
  jobs:
  - job: Rollback
    steps:
    - script: |
        echo "Rolling back to previous version..."
      displayName: "Rollback Deployment"